<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="그림 작업을 위한 3D 인체 포즈 도우미" />
    <title>Pose Easy — 3D Mannequin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar" aria-label="카메라 각도 선택">
        <h1>Pose Easy</h1>
        <div class="camera-controls" role="group" aria-label="카메라 구도">
          <button type="button" data-view="front">정면</button>
          <button type="button" data-view="side">측면</button>
          <button type="button" data-view="back">후면</button>
          <button type="button" data-view="high">하이앵글</button>
          <button type="button" data-view="low">로우앵글</button>
          <button type="button" class="reset-button" data-view="reset">카메라 초기화</button>
        </div>
      </header>

      <section class="viewport" aria-label="3D 인체 마네킹 뷰포트">
        <canvas id="scene-canvas"></canvas>
        <p class="hint">왼쪽 드래그: 회전 · 휠: 확대/축소 · 오른쪽 드래그: 화면 이동</p>
        <p id="model-status" class="model-status" role="status">3D 인체 모델을 불러오는 중…</p>
        <aside class="joint-panel" aria-labelledby="right-arm-title">
          <h2 id="right-arm-title">오른팔 조절</h2>

          <div class="joint-control">
            <label for="shoulder-lift">팔 올리기</label>
            <input id="shoulder-lift" type="range" min="-100" max="100" value="0" disabled />
            <div class="slider-labels"><span>내리기</span><span>올리기</span></div>
          </div>

          <div class="joint-control">
            <label for="shoulder-spread">팔 벌리기</label>
            <input id="shoulder-spread" type="range" min="-70" max="105" value="0" disabled />
            <div class="slider-labels"><span>모으기</span><span>벌리기</span></div>
          </div>

          <div class="joint-control">
            <label for="shoulder-twist">팔 방향 돌리기</label>
            <input id="shoulder-twist" type="range" min="-75" max="90" value="0" disabled />
            <div class="slider-labels"><span>안쪽</span><span>바깥쪽</span></div>
          </div>

          <div class="joint-control">
            <label for="elbow-bend">팔꿈치</label>
            <input id="elbow-bend" type="range" min="0" max="100" value="0" disabled />
            <div class="slider-labels"><span>펴기</span><span>굽히기</span></div>
          </div>

          <button id="right-arm-reset" type="button" disabled>오른팔 초기화</button>
        </aside>
      </section>
    </main>

    <!-- Three.js example modules import the "three" module name internally. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
